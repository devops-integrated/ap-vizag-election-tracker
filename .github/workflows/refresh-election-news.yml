name: Refresh AP election intelligence

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-election-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Refresh election feed and update timestamp
        run: python scripts/fetch_news.py

      - name: Publish refreshed data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json update-log.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Refresh AP election intelligence"
            git push origin main
          fi

      - name: Confirm Vercel source update
        run: echo "Vercel should deploy the main branch automatically; the public URL remains the project domain, not this deployment's generated URL."
